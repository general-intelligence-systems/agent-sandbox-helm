apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-sandbox.fullname" . }}-webhook-service
  labels:
  {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  type: {{ .Values.webhookService.type }}
  selector:
    app: agent-sandbox-controller
    {{- include "agent-sandbox.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.webhookService.ports | toYaml | nindent 2 }}
