apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-sandbox.fullname" . }}-controller
  labels:
    app: agent-sandbox-controller
  {{- include "agent-sandbox.labels" . | nindent 4 }}
spec:
  type: {{ .Values.controller.type }}
  selector:
    app: agent-sandbox-controller
    {{- include "agent-sandbox.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.controller.ports | toYaml | nindent 2 }}
