controller:
  agentSandboxController:
    args:
    - --leader-elect=true
    image:
      repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
      tag: v0.5.1
  nodeSelector: {}
  ports:
  - name: metrics
    port: 8080
    protocol: TCP
    targetPort: metrics
  replicas: 1
  tolerations: []
  topologySpreadConstraints: []
  type: ClusterIP
kubernetesClusterDomain: cluster.local
serviceAccount:
  annotations: {}
  automount: true
  create: true
  name: ""
webhookService:
  ports:
  - name: webhook
    port: 443
    protocol: TCP
    targetPort: 9443
  type: ClusterIP
